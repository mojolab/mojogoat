<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojoGOAT - Graph Visualization</title>
    <link rel="icon" href="images/mojogoatlogo1.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #graphContainer {
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 20px;
        }
        #listContainer {
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .split-pane {
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        .pane {
            flex: 1;
        }
        .tooltip-mine {
            position: relative;
            background: #fff;
            border: 1px solid #a72121;
            padding: 5px;
            pointer-events: none;
            color: #000;
            z-index: 1000;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex align-items-center mb-4">
            <img src="images/mojogoatlogo1.png" alt="MojoGOAT Logo" height="60" class="me-3">
            <h1 class="mb-0">MojoGOAT Graph Visualization</h1>
        </div>
        <div class="split-pane">
            <div id="listContainer" class="pane">
                <h2>Relationships</h2>
                <ul id="relationshipList" class="list-group">
                    <!-- Relationships will be dynamically loaded here -->
                </ul>
            </div>
            <div id="graphContainer" class="pane">
                <h2>Graph</h2>
                <!-- Graph visualization will be rendered here -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.2/d3.min.js"></script>
    <script src="graph.js"></script>
</body>
</html>
