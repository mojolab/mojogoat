<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Relationship Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .relationship-card {
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .relationship-card:hover {
            background-color: #f8f9fa;
        }
        .split-pane {
            display: flex;
            height: 80vh;
        }
        .pane {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
        }
        #listContainer {
            border-right: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Graph Relationship Editor</h1>
        
        <div class="row mb-4">
            <div class="col">
                <input type="file" id="fileInput" class="form-control" accept=".txt">
            </div>
            <div class="col">
                <button id="visualizeBtn" class="btn btn-primary">Visualize Graph</button>
            </div>
            <div class="col">
                <button id="saveBtn" class="btn btn-primary" disabled>Save Changes</button>
            </div>
        </div>  

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Add New Relationship</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="sourceInput" class="form-control" placeholder="Source">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="storyInput" class="form-control" placeholder="Story">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="targetInput" class="form-control" placeholder="Target">
                    </div>
                    <div class="col-md-2">
                        <input type="date" id="dateInput" class="form-control">
                    </div>
                    <div class="col-md-1">
                        <button id="addBtn" class="btn btn-success">Add</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="split-pane">
            <div id="listContainer" class="pane">
                <h2>Relationships</h2>
                <div class="col">
                    <button id="selectAllBtn" class="btn btn-secondary">Select All</button>
                </div>
                <ul id="relationshipList" class="list-group">
                    <!-- Relationships will be dynamically loaded here -->
                </ul>
            </div>
            <div id="graphContainer" class="pane">
                <h2>Graph</h2>
                <!-- Graph visualization will be rendered here -->
            </div>
        </div>

 
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.2/d3.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
