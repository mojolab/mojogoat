[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mojogoat"
version = "0.1.0"
description = "Graph of All Things — a multi-backend quad store engine"
requires-python = ">=3.11"
dependencies = [
    # Web / API layer (Flask REST server)
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-migrate>=4.0",
    "flask-mongoengine>=1.0",
    "flask-sqlalchemy>=3.1",
    # Storage backends
    "mongoengine>=0.27",
    "sqlalchemy>=2.0",
    "neo4j>=5.0",          # official driver — used by newneo4jgoatcopilot.py
    # Async support
    "aiofiles>=23.0",
    "asgiref>=3.7",
]

[project.optional-dependencies]
legacy = [
    # py2neo is used by the old neo4jgoat.py only.
    # Target: retire neo4jgoat.py and remove this group entirely.
    "py2neo>=2021.2",
]
falkordb = [
    "falkordb>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["mojogoat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
markers = [
    "integration: requires live external services — deselect with '-m not integration'",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
