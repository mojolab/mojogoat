<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Relationship Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .relationship-card {
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .relationship-card:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Graph Relationship Editor</h1>
        
        <div class="row mb-4">
            <div class="col">
                <input type="file" id="fileInput" class="form-control" accept=".txt">
            </div>
            <div class="col">
                <button id="saveBtn" class="btn btn-primary" disabled>Save Changes</button>
            </div>
        </div>  

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Add New Relationship</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="sourceInput" class="form-control" placeholder="Source">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="storyInput" class="form-control" placeholder="Story">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="targetInput" class="form-control" placeholder="Target">
                    </div>
                    <div class="col-md-2">
                        <input type="date" id="dateInput" class="form-control">
                    </div>
                    <div class="col-md-1">
                        <button id="addBtn" class="btn btn-success">Add</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="relationshipsList"></div>
        <a href="graph.html" class="btn btn-secondary mt-3">View Graph Visualization</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
